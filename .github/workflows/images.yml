# Publishes the project's two images to GitHub Container Registry on every push to main: the bot with
# its pages (the root Dockerfile), and VoiceStudio with VoxCPM2 (deploy/speech/). Each is tagged with
# the commit and as latest. A package is private when first published, and the chart pulls without
# credentials, so make both public once (README.md, "Deploy on LKE").
# https://docs.github.com/en/actions/tutorials/publish-packages/publish-docker-images
name: images

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write # GITHUB_TOKEN may publish this repository's packages

jobs:
  bot:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # GHCR names must be lowercase, and an owner's name may not be.
      - id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/voice-companion-bot" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.sha }}
            ${{ steps.image.outputs.name }}:latest

  speech:
    runs-on: ubuntu-24.04
    steps:
      # VoiceStudio's own reclaim list, from the workflow that publishes its image:
      # https://github.com/debpalash/VoiceStudio/blob/v0.5.6/.github/workflows/docker.yml
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache /usr/share/swift \
            /usr/local/share/boost /usr/local/lib/node_modules
          sudo docker image prune --all --force
          sudo apt-get clean
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/voice-companion-speech" >> "$GITHUB_OUTPUT"
      # ASSUMPTION (unverified): the speech image builds on a GitHub-hosted runner only after freeing
      # about 40 GB, as VoiceStudio's own v0.5.6 workflow does; its base alone is 5.74 GB compressed.
      # The first CI run settles it: the step above logs the free space before and after.
      # No GitHub Actions cache: layers this size would overrun the repository's cache.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: deploy/speech
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.sha }}
            ${{ steps.image.outputs.name }}:latest
