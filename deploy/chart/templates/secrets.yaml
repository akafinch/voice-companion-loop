# Terraform's generated secrets, as cluster Secrets that pods read when they start.

# VoiceStudio's admin key: the speech service checks it, and only the bot presents it.
apiVersion: v1
kind: Secret
metadata:
  name: speech-key
type: Opaque
stringData:
  key: {{ .Values.secrets.voiceStudioAdminKey | quote }}
---
# The relay's shared secret. STUNner's auth service signs each call's short-lived credential with it,
# and the relay checks the credential against it.
# https://github.com/l7mp/stunner/blob/v1.2.1/docs/AUTH.md
apiVersion: v1
kind: Secret
metadata:
  name: relay-auth
type: Opaque
stringData:
  type: ephemeral
  secret: {{ .Values.secrets.turnSharedSecret | quote }}
